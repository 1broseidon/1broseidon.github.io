# Deploys chain.sh to Cloudflare Workers.
#
# Workers serves chain.sh: the zone has a `chain.sh/*` route bound to the
# `chain-sh` Worker, which answers ahead of the origin. GitHub Pages has been
# retired and deploy.yml is gone.
#
# Still manual-trigger only, because this repo has no CLOUDFLARE_API_TOKEN or
# CLOUDFLARE_ACCOUNT_ID secret to deploy with. Add both, then change the
# trigger below to `push: branches: [main]` for deploys on merge. Until then,
# `npm run deploy` from a checkout is what ships the site.

name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
